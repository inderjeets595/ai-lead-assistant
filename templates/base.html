<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Chatbot Admin{% endblock %}</title>
    <meta name="description" content="AI-Powered Lead Management Dashboard">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap (modals only) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block extra_css %}{% endblock %}
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
    </script>
</head>
<body>

<div class="app-shell">
    <!-- ══════════ SIDEBAR ══════════ -->
    <aside class="sidebar" role="navigation" aria-label="Main Navigation">
        <div class="sidebar-logo" aria-hidden="true">
            <i class="fas fa-robot"></i>
        </div>

        <nav class="sidebar-nav">
            <a href="/admin"
               class="nav-item {% if request.path == '/admin' %}active{% endif %}"
               data-tip="Leads"
               title="Leads List"
               aria-label="Leads List">
                <i class="fas fa-users"></i>
            </a>
            <a href="/dashboard"
               class="nav-item {% if request.path == '/dashboard' %}active{% endif %}"
               data-tip="Analytics"
               title="Analytics Dashboard"
               aria-label="Analytics">
                <i class="fas fa-chart-line"></i>
            </a>
            <a href="/export"
               class="nav-item"
               data-tip="Export"
               title="Export Data"
               aria-label="Export Data">
                <i class="fas fa-file-export"></i>
            </a>
        </nav>

        <div class="sidebar-bottom">
            <a href="/logout"
               class="nav-item"
               data-tip="Logout"
               title="Logout"
               aria-label="Logout"
               onclick="return confirm('Sign out of Admin Dashboard?')">
                <i class="fas fa-arrow-right-from-bracket"></i>
            </a>
        </div>
    </aside>

    <!-- ══════════ MAIN ══════════ -->
    <div class="main-area">

        <!-- Topbar -->
        <header class="topbar" role="banner">
            <div class="topbar-title">
                {% block page_title %}Dashboard{% endblock %}
                <span>AI Chatbot Admin</span>
            </div>
            <div class="topbar-right">
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="topbar-clock">
                    <i class="fas fa-clock"></i>
                    <span id="liveClock">--:--</span>
                </div>
                <div class="topbar-admin-badge">
                    <div class="admin-avatar"><i class="fas fa-user" style="color:#fff;font-size:11px;"></i></div>
                    Admin
                    <div class="online-dot"></div>
                </div>
            </div>
        </header>

        <!-- Page Body -->
        <main class="page-content" id="pageContent">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    /* Live Clock */
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2,'0');
        const m = String(now.getMinutes()).padStart(2,'0');
        const s = String(now.getSeconds()).padStart(2,'0');
        const el = document.getElementById('liveClock');
        if (el) el.textContent = `${h}:${m}:${s}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>

<script>
    /* Theme Toggle Switcher */
    const themeToggleBtn = document.getElementById('themeToggle');
    if (themeToggleBtn) {
        function updateToggleIcon(isDark) {
            const icon = themeToggleBtn.querySelector('i');
            if (icon) {
                icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            }
        }
        const currentTheme = localStorage.getItem('theme') || 'light';
        const isCurrentlyDark = currentTheme === 'dark';
        updateToggleIcon(isCurrentlyDark);

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark-theme');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateToggleIcon(isDark);
            window.dispatchEvent(new CustomEvent('themeChanged', { detail: { theme: isDark ? 'dark' : 'light' } }));
        });
    }
</script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
