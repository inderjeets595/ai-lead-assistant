<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multilingual Chatbot Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-dark: #0a0e27;
            --chat-bg-dark: rgba(20, 25, 50, 0.8);
            --bot-msg-bg: #1e2749;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .chat-header {
            background: var(--chat-bg-dark);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 1000;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand i { color: #667eea; font-size: 1.3rem; }
        .brand h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }

        .status-indicator {
            color: #28a745;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .dot {
            height: 8px;
            width: 8px;
            background-color: #28a745;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Language Selector */
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            padding: 2px;
            transition: all 0.3s ease;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            line-height: 1.3;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .lang-btn:hover {
            background: rgba(102, 126, 234, 0.25);
            color: #a5b4fc;
        }

        .lang-btn.active {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.35);
        }

        #theme-toggle {
            background: none;
            border: none;
            color: #f1c40f;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #theme-toggle:hover { transform: rotate(20deg); }

        .btn-clear {
            background: transparent;
            border: 1px solid #dc3545;
            color: #dc3545;
            font-size: 0.78rem;
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            background: #dc3545;
            color: #fff;
        }

        /* Chat Main */
        .chat-main {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
            scroll-behavior: smooth;
            background: var(--bg-dark);
        }

        .chat-messages {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 10px;
        }

        /* Messages */
        .message {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            animation: fadeInUp 0.3s ease-out;
            padding: 0 20px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot-message { align-items: flex-start; }
        .user-message { align-items: flex-end; }

        .message-content {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            word-wrap: break-word;
        }

        .bot-message .message-content {
            background-color: var(--bot-msg-bg);
            color: #fff;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-message .message-content {
            background: var(--primary-gradient);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.65rem;
            margin-top: 3px;
            color: #aaa;
        }

        /* Footer */
        .chat-footer {
            background: var(--bg-dark);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 6px 0;
        }

        .footer-inner {
            max-width: 700px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .input-container {
            display: flex;
            align-items: center;
            background-color: rgba(30, 30, 60, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .input-container:focus-within {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.25);
            border: 1px solid rgba(102, 126, 234, 0.4);
        }

        .input-container input {
            flex: 1;
            border: none;
            background: transparent;
            color: #e0e0e0;
            padding: 10px 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }

        .input-container input::placeholder { color: #888; }

        #send-btn {
            background: var(--primary-gradient);
            border: none;
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        #send-btn:hover { transform: scale(1.08); }

        .disclaimer {
            text-align: center;
            margin-top: 4px;
            font-size: 0.72rem;
            color: #888;
        }

        /* Welcome Screen */
        .welcome-screen {
            padding: 40px 20px;
            text-align: center;
        }

        .welcome-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            white-space: pre-line;
        }

        .welcome-subtitle {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.6;
            white-space: pre-line;
        }

        .feature-list {
            display: grid;
            gap: 12px;
            max-width: 400px;
            margin: 30px auto;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #fff;
            animation: fadeInUp 0.5s ease-out;
        }

        .feature-icon {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .welcome-prompt {
            color: #ccc;
            margin-top: 30px;
            font-size: 0.95rem;
        }

        /* Mode Indicator */
        .mode-indicator {
            text-align: center;
            padding: 8px;
            font-size: 0.75rem;
            color: #667eea;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.2s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        /* Typing indicator */
        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 15px;
        }
        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #a5b4fc;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .lang-divider {
            border: none;
            border-top: 1px solid rgba(102, 126, 234, 0.3);
            margin: 6px 0;
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-inner">
                <div class="brand">
                    <i class="fas fa-robot"></i>
                    <div>
                        <h1>Business Project Assistant</h1>
                        <small class="status-indicator"><span class="dot"></span> Online</small>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="lang-selector" id="language-selector">
                        <button class="lang-btn active" data-lang="en" title="English">EN</button>
                        <button class="lang-btn" data-lang="pa" title="ਪੰਜਾਬੀ (Punjabi)">ਪੰ</button>
                        <button class="lang-btn" data-lang="both" title="Both Languages">
                            <i class="fas fa-language" style="font-size: 0.75rem;"></i>
                        </button>
                    </div>
                    <button id="theme-toggle"><i class="fas fa-sun"></i></button>
                    <button class="btn-clear" onclick="resetDemo()"><i class="fas fa-trash-alt"></i> Clear Chat</button>
                </div>
            </div>
        </header>

        <!-- Chat -->
        <main class="chat-main">
            <div id="chat-box" class="chat-messages"></div>
        </main>

        <!-- Footer -->
        <footer class="chat-footer">
            <div class="footer-inner">
                <div class="input-container">
                    <input type="text" id="msg" placeholder="Type your message or business inquiry...">
                    <button id="send-btn" onclick="handleSend()"><i class="fas fa-arrow-up"></i></button>
                </div>
                <div class="disclaimer" id="disclaimer">AI can make mistakes. Please verify important information.</div>
            </div>
        </footer>
    </div>

    <script>
        // =========================================================
        // LANGUAGE DATA
        // =========================================================
        const LANG = {
            en: {
                welcome: { title: "Business Project Assistant", subtitle: "Your intelligent lead qualification & customer support partner", prompt: "How can I assist you today?",
                    features: ["Answer customer queries instantly", "Collect lead information efficiently", "Generate qualified leads automatically", "Connect customers with your team"] },
                placeholder: "Type your message or business inquiry...",
                disclaimer: "AI can make mistakes. Please verify important information.",
                flow: [
                    { bot: "AI Business Chatbot<br><br>What is your name?", userHint: "Jatinder Singh" },
                    { bot: "Please enter your phone number", userHint: "789789797" },
                    { bot: "Please enter your email address", userHint: "email@yopmail.com" },
                    { bot: "What service do you need?", userHint: "I want to sell my laptop" },
                    { bot: `Lead Saved Successfully<br><br>Name: Jatinder Singh<br>Phone: 789789797<br>Email: email@yopmail.com<br>Requirement: I want to sell my laptop<br><br>Sentiment: Negative<br>Lead Score: 0<br>Lead Status: Cold Lead<br><br>AI Reply:<br>You want to sell your laptop! We can help you get a great price. We offer services in selling used electronics at competitive rates. Would you like to share your laptop specifications?` },
                ],
            },
            pa: {
                welcome: { title: "ਕਾਰੋਬਾਰੀ ਪ੍ਰੋਜੈਕਟ ਸਹਾਇਕ", subtitle: "ਤੁਹਾਡਾ ਬੁੱਧੀਮਾਨ ਲੀਡ ਯੋਗਤਾ ਅਤੇ ਗਾਹਕ ਸਹਾਇਤਾ ਸਾਥੀ", prompt: "ਅੱਜ ਮੈਂ ਤੁਹਾਡੀ ਕਿਵੇਂ ਮਦਦ ਕਰ ਸਕਦਾ ਹਾਂ?",
                    features: ["ਗਾਹਕਾਂ ਦੇ ਸਵਾਲਾਂ ਦੇ ਤੁਰੰਤ ਜਵਾਬ ਦਿਓ", "ਲੀਡ ਜਾਣਕਾਰੀ ਕੁਸ਼ਲਤਾ ਨਾਲ ਇਕੱਠੀ ਕਰੋ", "ਯੋਗ ਲੀਡਾਂ ਆਪਣੇ ਆਪ ਬਣਾਓ", "ਗਾਹਕਾਂ ਨੂੰ ਆਪਣੀ ਟੀਮ ਨਾਲ ਜੋੜੋ"] },
                placeholder: "ਆਪਣਾ ਸੁਨੇਹਾ ਜਾਂ ਕਾਰੋਬਾਰੀ ਪੁੱਛਗਿੱਛ ਟਾਈਪ ਕਰੋ...",
                disclaimer: "AI ਗਲਤੀਆਂ ਕਰ ਸਕਦਾ ਹੈ। ਕਿਰਪਾ ਕਰਕੇ ਮਹੱਤਵਪੂਰਨ ਜਾਣਕਾਰੀ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ।",
                flow: [
                    { bot: "AI Business Chatbot<br><br>ਤੁਹਾਡਾ ਨਾਮ ਕੀ ਹੈ?", userHint: "Jatinder Singh" },
                    { bot: "ਆਪਣਾ ਫੋਨ ਨੰਬਰ ਦਰਜ ਕਰੋ", userHint: "789789797" },
                    { bot: "ਆਪਣਾ ਈਮੇਲ ਦਰਜ ਕਰੋ", userHint: "email@yopmail.com" },
                    { bot: "ਤੁਹਾਨੂੰ ਕਿਹੜੀ ਸੇਵਾ ਚਾਹੀਦੀ ਹੈ?", userHint: "ਮੈਂ ਆਪਣਾ ਲੈਪਟਾਪ ਵੇਚਣਾ ਚਾਹੁੰਦਾ ਹਾਂ" },
                    { bot: `ਲੀਡ ਸਫਲਤਾਪੂਰਵਕ ਸੇਵ ਹੋ ਗਈ<br><br>ਨਾਮ: Jatinder Singh<br>ਫੋਨ: 789789797<br>ਈਮੇਲ: email@yopmail.com<br>ਲੋੜ: ਮੈਂ ਆਪਣਾ ਲੈਪਟਾਪ ਵੇਚਣਾ ਚਾਹੁੰਦਾ ਹਾਂ<br><br>ਭਾਵਨਾ: Negative<br>ਲੀਡ ਸਕੋਰ: 0<br>ਲੀਡ ਸਥਿਤੀ: Cold Lead<br><br>AI ਜਵਾਬ:<br>ਤੁਸੀਂ ਆਪਣਾ ਲੈਪਟਾਪ ਵੇਚਣਾ ਚਾਹੁੰਦੇ ਹੋ! ਅਸੀਂ ਤੁਹਾਨੂੰ ਇੱਕ ਵਧੀਆ ਕੀਮਤ ਤੇ ਰੇਟ ਵਿੱਚ ਮਦਦ ਕਰ ਸਕਦੇ ਹਾਂ। ਕੀ ਤੁਸੀਂ ਮੈਨੂੰ ਆਪਣੇ ਲੈਪਟਾਪ ਦੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਦੱਸੋਗੇ?` },
                ],
            },
            both: {
                welcome: { title: "Business Project Assistant\nਕਾਰੋਬਾਰੀ ਪ੍ਰੋਜੈਕਟ ਸਹਾਇਕ", subtitle: "Your intelligent lead qualification & customer support partner\nਤੁਹਾਡਾ ਬੁੱਧੀਮਾਨ ਲੀਡ ਯੋਗਤਾ ਅਤੇ ਗਾਹਕ ਸਹਾਇਤਾ ਸਾਥੀ", prompt: "How can I assist you? / ਮੈਂ ਤੁਹਾਡੀ ਕਿਵੇਂ ਮਦਦ ਕਰਾਂ?",
                    features: ["Answer queries instantly / ਤੁਰੰਤ ਜਵਾਬ ਦਿਓ", "Collect lead info / ਲੀਡ ਜਾਣਕਾਰੀ ਇਕੱਠੀ ਕਰੋ", "Generate leads / ਯੋਗ ਲੀਡਾਂ ਬਣਾਓ", "Connect customers / ਗਾਹਕਾਂ ਨੂੰ ਜੋੜੋ"] },
                placeholder: "Type your message... / ਆਪਣਾ ਸੁਨੇਹਾ ਟਾਈਪ ਕਰੋ...",
                disclaimer: "AI can make mistakes. / AI ਗਲਤੀਆਂ ਕਰ ਸਕਦਾ ਹੈ।",
                flow: [
                    { bot: "AI Business Chatbot<br><br>What is your name?<br><hr class='lang-divider'>ਤੁਹਾਡਾ ਨਾਮ ਕੀ ਹੈ?", userHint: "Jatinder Singh" },
                    { bot: "Please enter your phone number<br><hr class='lang-divider'>ਆਪਣਾ ਫੋਨ ਨੰਬਰ ਦਰਜ ਕਰੋ", userHint: "789789797" },
                    { bot: "Please enter your email address<br><hr class='lang-divider'>ਆਪਣਾ ਈਮੇਲ ਦਰਜ ਕਰੋ", userHint: "email@yopmail.com" },
                    { bot: "What service do you need?<br><hr class='lang-divider'>ਤੁਹਾਨੂੰ ਕਿਹੜੀ ਸੇਵਾ ਚਾਹੀਦੀ ਹੈ?", userHint: "I want to sell my laptop" },
                    { bot: `Lead Saved Successfully / ਲੀਡ ਸਫਲਤਾਪੂਰਵਕ ਸੇਵ ਹੋ ਗਈ<br><br>Name / ਨਾਮ: Jatinder Singh<br>Phone / ਫੋਨ: 789789797<br>Email / ਈਮੇਲ: email@yopmail.com<br>Requirement / ਲੋੜ: I want to sell my laptop<br><br>Sentiment / ਭਾਵਨਾ: Negative<br>Lead Score / ਲੀਡ ਸਕੋਰ: 0<br>Lead Status / ਲੀਡ ਸਥਿਤੀ: Cold Lead<br><br>AI Reply / AI ਜਵਾਬ:<br>You want to sell your laptop! We can help you get a great price and sell it at competitive rates. Would you like to share your laptop specifications?<br><hr class='lang-divider'>ਤੁਸੀਂ ਆਪਣਾ ਲੈਪਟਾਪ ਵੇਚਣਾ ਚਾਹੁੰਦੇ ਹੋ! ਅਸੀਂ ਤੁਹਾਨੂੰ ਵਧੀਆ ਕੀਮਤ ਤੇ ਮਦਦ ਕਰ ਸਕਦੇ ਹਾਂ। ਕੀ ਤੁਸੀਂ ਲੈਪਟਾਪ ਦੀਆਂ ਵਿਸ਼ੇਸ਼ਤਾਵਾਂ ਦੱਸੋਗੇ?` },
                ],
            }
        };

        let currentLang = "en";
        let currentStep = -1; // -1 = welcome screen shown
        let isAnimating = false;

        // =========================================================
        // INIT
        // =========================================================
        document.addEventListener("DOMContentLoaded", () => {
            renderWelcome();
            initLangButtons();

            document.getElementById("msg").addEventListener("keydown", (e) => {
                if (e.key === "Enter") { e.preventDefault(); handleSend(); }
            });
        });

        function initLangButtons() {
            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const lang = btn.dataset.lang;
                    currentLang = lang;
                    currentStep = -1;

                    document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    document.getElementById("msg").placeholder = LANG[lang].placeholder;
                    document.getElementById("disclaimer").textContent = LANG[lang].disclaimer;

                    renderWelcome();
                });
            });
        }

        // =========================================================
        // WELCOME SCREEN
        // =========================================================
        function renderWelcome() {
            const data = LANG[currentLang].welcome;
            const features = data.features.map(f =>
                `<div class="feature-item"><span class="feature-icon">✓</span><span>${f}</span></div>`
            ).join("");

            document.getElementById("chat-box").innerHTML = `
                <div class="welcome-screen" style="animation: fadeInUp 0.4s ease-out;">
                    <div class="welcome-icon">🤖</div>
                    <h2 class="welcome-title">${data.title}</h2>
                    <p class="welcome-subtitle">${data.subtitle}</p>
                    <div class="feature-list">${features}</div>
                    <p class="welcome-prompt">${data.prompt}</p>
                </div>
            `;
        }

        // =========================================================
        // SEND MESSAGE / SIMULATE
        // =========================================================
        const MOCK_PA_TRANS = {
            "hi": "ਸਤਿ ਸ਼੍ਰੀ ਅਕਾਲ",
            "hello": "ਸਤਿ ਸ਼੍ਰੀ ਅਕਾਲ",
            "jatinder singh": "ਜਤਿੰਦਰ ਸਿੰਘ",
            "inderjeet": "ਇੰਦਰਜੀਤ",
            "i want to sell my laptop": "ਮੈਂ ਆਪਣਾ ਲੈਪਟਾਪ ਵੇਚਣਾ ਚਾਹੁੰਦਾ ਹਾਂ",
            "i want web development": "ਮੈਨੂੰ ਵੈੱਬ ਡਿਵੈਲਪਮੈਂਟ ਚਾਹੀਦੀ ਹੈ"
        };

        function formatUserPreview(text, lang) {
            if (!text || lang === "en") return text;
            const stripped = text.trim();
            if (stripped.replace(/[^0-9]/g, '').length === stripped.length || stripped.includes("@")) {
                return text;
            }
            const lower = stripped.toLowerCase();
            const pa = MOCK_PA_TRANS[lower] || text;
            if (lang === "pa") {
                return pa;
            } else if (lang === "both") {
                return pa !== text ? `${text}<br><hr class='lang-divider'>${pa}` : text;
            }
            return text;
        }

        async function handleSend() {
            if (isAnimating) return;
            const input = document.getElementById("msg");
            const flow = LANG[currentLang].flow;

            // First interaction — use input or hint
            const nextStep = currentStep + 1;
            if (nextStep >= flow.length) return;

            const step = flow[nextStep];
            const userText = input.value.trim() || step.userHint;
            input.value = "";

            // Hide welcome screen
            const welcomeEl = document.querySelector(".welcome-screen");
            if (welcomeEl) welcomeEl.remove();

            const formattedUserText = formatUserPreview(userText, currentLang);

            // If this is the very first message, show the welcome bot message first
            if (currentStep === -1) {
                isAnimating = true;
                addMessage("user", formattedUserText);
                await wait(400);
                addTyping();
                await wait(800);
                removeTyping();
                addMessage("bot", step.bot);
                currentStep = 0;
                // Auto-fill next hint
                if (flow[1]) input.placeholder = `e.g. ${flow[1].userHint}`;
                isAnimating = false;
                return;
            }

            // Normal steps
            isAnimating = true;
            addMessage("user", formattedUserText);
            currentStep = nextStep;

            await wait(400);
            addTyping();
            await wait(900);
            removeTyping();
            addMessage("bot", step.bot);

            // Update placeholder hint for next step
            if (currentStep + 1 < flow.length) {
                input.placeholder = `e.g. ${flow[currentStep + 1].userHint}`;
            } else {
                input.placeholder = LANG[currentLang].placeholder;
            }

            isAnimating = false;
        }

        // =========================================================
        // HELPERS
        // =========================================================
        function addMessage(sender, html) {
            const chatBox = document.getElementById("chat-box");
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const div = document.createElement("div");
            div.className = `message ${sender}-message`;
            div.innerHTML = `
                <div class="message-content">${html}</div>
                <div class="message-time">${time}</div>
            `;
            chatBox.appendChild(div);
            document.querySelector(".chat-main").scrollTop = document.querySelector(".chat-main").scrollHeight;
        }

        function addTyping() {
            const chatBox = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "message bot-message";
            div.id = "typing-indicator";
            div.innerHTML = `<div class="message-content"><div class="typing"><span></span><span></span><span></span></div></div>`;
            chatBox.appendChild(div);
            document.querySelector(".chat-main").scrollTop = document.querySelector(".chat-main").scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

        function resetDemo() {
            currentStep = -1;
            document.getElementById("msg").placeholder = LANG[currentLang].placeholder;
            renderWelcome();
        }
    </script>
</body>
</html>
